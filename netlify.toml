[build]
  command = "npm ci"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"
  included_files = ["vendor/ckan-mcp/**"]

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/cors-proxy"
  to = "/.netlify/functions/cors-proxy"
  status = 200
