name: Refresh Vendor

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-vendor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh vendored CKAN MCP
        run: bash scripts/refresh-vendor.sh

      - name: Read vendor metadata
        id: meta
        run: |
          SHA=$(node --input-type=module -e "import fs from 'node:fs'; const m = JSON.parse(fs.readFileSync('vendor/ckan-mcp/.upstream.json', 'utf8')); console.log(m.commit);")
          VERSION=$(node --input-type=module -e "import fs from 'node:fs'; const m = JSON.parse(fs.readFileSync('vendor/ckan-mcp/.upstream.json', 'utf8')); console.log(m.version);")
          DATE=$(node --input-type=module -e "import fs from 'node:fs'; const m = JSON.parse(fs.readFileSync('vendor/ckan-mcp/.upstream.json', 'utf8')); console.log(m.date);")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-vendor
          delete-branch: true
          title: "chore(vendor): refresh ckan-mcp-server to ${{ steps.meta.outputs.sha_short }}"
          commit-message: "chore(vendor): refresh ckan-mcp-server to ${{ steps.meta.outputs.sha_short }}"
          body: |
            Automated vendor refresh from `ondata/ckan-mcp-server`.

            - Upstream version: `${{ steps.meta.outputs.version }}`
            - Upstream commit: `${{ steps.meta.outputs.sha }}`
            - Upstream date: `${{ steps.meta.outputs.date }}`

            Changes were generated by `scripts/refresh-vendor.sh`.
          labels: |
            dependencies
            automation
